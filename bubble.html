<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bubble Sort in Scheme (running in the browser)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.5rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.5rem;
    }
    #output {
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .note {
      font-size: 0.9rem;
      color: #555;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Bubble Sort — written in Scheme, run in the browser</h1>
  <p>The list below is sorted by Scheme code embedded in this page.</p>

  <!-- BiwaScheme prints its output here -->
  <div id="output">Loading Scheme interpreter…</div>

  <p class="note">
    The entire bubble‑sort algorithm lives in the
    <code>&lt;script type="text/biwascheme"&gt;</code> tag.
    JavaScript is only used to load the BiwaScheme runtime.
  </p>

  <!-- 1. Load the BiwaScheme interpreter (JavaScript) -->
  <script src="https://cdn.jsdelivr.net/npm/biwascheme@0.6.9/release/biwascheme-min.js"></script>

  <!-- 2. Scheme code: bubble sort and display -->
  <script type="text/biwascheme">
    ;; ------------------------------------------------------------
    ;;  BUBBLE SORT (pure Scheme)
    ;; ------------------------------------------------------------
    (define (bubble-sort lst)
      (define (pass lst swapped?)
        (cond
          ((null? lst) '())
          ((null? (cdr lst)) lst)
          (else
           (let ((a (car lst))
                 (b (cadr lst))
                 (rest (cddr lst)))
             (if (> a b)
                 (cons b (pass (cons a rest) #t))   ; swap
                 (cons a (pass (cons b rest) swapped?)))))))

      (let loop ((l lst) (changed? #t))
        (if changed?
            (let ((new-l (pass l #f)))
              ;; `pass` returns a new list; check if it differs
              (if (equal? l new-l)
                  new-l
                  (loop new-l #t)))
            l)))

    ;; ------------------------------------------------------------
    ;;  Demo data and output
    ;; ------------------------------------------------------------
    (define unsorted '(5 3 8 1 2 9 4 7 6))
    (define sorted   (bubble-sort unsorted))

    (display "Unsorted: ")
    (display unsorted)
    (newline)
    (display "Sorted:   ")
    (display sorted)
    (newline)
  </script>

  <!-- 3. Optional: copy Scheme output into the div -->
  <script>
    // BiwaScheme writes to a hidden console by default.
    // We capture its output and put it into #output for visibility.
    window.addEventListener('load', function () {
      setTimeout(function () {
        const consoleDiv = document.getElementById('bs-console');
        const outputDiv  = document.getElementById('output');
        if (consoleDiv && outputDiv) {
          outputDiv.textContent = consoleDiv.textContent;
        } else {
          outputDiv.textContent =
            'Scheme code ran, but output could not be captured. ' +
            'Open the browser console to see the result.';
        }
      }, 100); // give the Scheme code time to run
    });
  </script>
</body>
</html>
